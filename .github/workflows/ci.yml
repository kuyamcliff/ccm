name: CI

# Runs on every push and pull request. Until this existed there was no
# automated check of any kind on this repository: a type error or a broken
# money helper only surfaced when a deploy failed, or when a customer hit it.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A newer push to the same branch makes the in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Typecheck
        run: npm run typecheck
        working-directory: backend
      - name: Tests
        run: npm test
        working-directory: backend
      - name: Build
        run: npm run build
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  integration:
    name: Integration (real database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccm
          POSTGRES_PASSWORD: ccm
          POSTGRES_DB: ccm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ccm:ccm@localhost:5432/ccm
      NODE_ENV: development
      JWT_SECRET: ci-only-secret-000000000000000000000000000000
      QR_SIGNING_SECRET: ci-only-qr-secret-1111111111111111111111111
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Create the schema
        # Also proves the schema in this repository can build a database from
        # nothing, which is the property that was missing entirely.
        run: npm run db:setup
        working-directory: backend
      - name: Seed development data
        run: npm run db:seed
        working-directory: backend
      - name: Integration tests
        run: npm run test:integration
        working-directory: backend

  constraints:
    name: Product constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No card-payment UI anywhere
        # MTN Mobile Money and Orange Money are the only payment methods this
        # product offers. This is a standing product decision, so it is checked
        # rather than trusted: a card field reaching a customer is a defect.
        #
        # Only unambiguous card terms are matched. "Stripe" is deliberately not
        # in this list because it is an ordinary English word that appears in
        # prose about the floor plan; a Stripe *dependency* is caught below,
        # which is where one would actually show up.
        run: |
          if grep -rniE '\b(visa|mastercard|paypal|cvv|card number|credit card|debit card)\b' \
               frontend/src backend/src ; then
            echo "::error::Card-payment reference found. CCM accepts MTN and Orange Money only."
            exit 1
          fi
          if grep -riE '"(stripe|@stripe/[a-z-]+|braintree|paypal[a-z-]*)"' \
               frontend/package.json backend/package.json ; then
            echo "::error::Card-payment dependency found. CCM accepts MTN and Orange Money only."
            exit 1
          fi
          echo "OK: no card-payment references or dependencies."

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget=resizes-content` makes the on-screen keyboard shrink
         the layout viewport instead of sliding the page up under it, which is
         what keeps a sheet's buttons reachable while a field has focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070707" />

    <title>Cam Chop Meat, Buea | The best meat in Buea</title>
    <meta
      name="description"
      content="The best meat in Buea. Chicken, goat and pork grilled fresh over the fire. See the menu and prices in FCFA, order takeaway with Mobile Money, or hold a table. Razel Street, opposite the P and T school, Buea."
    />
    <link rel="canonical" href="https://camchopmeat.com/" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Cam Chop Meat" />
    <meta property="og:title" content="Cam Chop Meat, Buea" />
    <meta
      property="og:description"
      content="The best meat in Buea. Chicken, goat and pork straight off the fire. Order takeaway or hold a table, both from your phone."
    />
    <meta property="og:url" content="https://camchopmeat.com/" />
    <meta property="og:locale" content="en_GB" />

    <!--
      The picture that shows when somebody shares the link.

      This site is found through TikTok, which means it is mostly passed around
      as a link in WhatsApp and DMs, and a link with no image is a grey box with
      a URL under it. None of those crawlers run JavaScript, so this has to be
      in the served HTML: setting it from React would be setting it long after
      the only reader that mattered had gone.

      `summary_large_image` is what makes it the wide card rather than a
      thumbnail beside the text.
    -->
    <meta property="og:image" content="https://camchopmeat.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cam Chop Meat, Buea: chicken, goat and pork over the fire" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://camchopmeat.com/og-image.png" />

    <!--
      What the restaurant is, in the form Google reads.

      Without this the site is just words on a page; with it, the address, the
      hours and the fact that it takes bookings can appear in the search result
      itself and in Maps. The address and hours mirror the fallbacks in
      src/state/venue.tsx, and both are editable in Desk > Details, so if the
      owner changes them there, change them here too.

      There is no phone number, on purpose. Nothing in this codebase hardcodes
      one, and inventing one for a real business is worse than omitting it.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Cam Chop Meat",
        "description": "The best meat in Buea. Chicken, goat and pork grilled fresh over the fire.",
        "url": "https://camchopmeat.com/",
        "image": "https://camchopmeat.com/og-image.png",
        "servesCuisine": ["Cameroonian", "Grill", "Barbecue"],
        "priceRange": "$$",
        "currenciesAccepted": "XAF",
        "paymentAccepted": "MTN Mobile Money, Orange Money, Cash",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Razel Street, opposite P and T school",
          "addressLocality": "Buea",
          "addressRegion": "South-West",
          "addressCountry": "CM"
        },
        "openingHours": "Mo-Su 12:00-23:00",
        "acceptsReservations": "https://camchopmeat.com/book",
        "hasMenu": "https://camchopmeat.com/menu"
      }
    </script>

    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts are bundled with the app and served from this origin, so there is
         no third-party connection to warm up here. See src/main.tsx. -->

    <!--
      ── The hero photograph, before any JavaScript has run ──────────────────

      This is the single biggest saving in the rewrite and it is eleven lines.

      The home page opens on a photograph whose URL used to be unknowable until
      three API round trips had finished, so on a slow connection nothing even
      *asked* for an image for several seconds. The last visit's boot payload is
      in localStorage, and it names that photograph. Reading it here, in a
      blocking script in the head, means the download starts before the browser
      has finished parsing this file, let alone downloading React.

      `fetchpriority="high"` is the half that matters. Without it the browser
      treats the image like everything else it has been asked for and it queues
      behind the JavaScript; with it, the photo and the bundle race, which is
      what we want, because neither is any use without the other.

      Wrapped in try/catch and doing nothing at all on a first visit: it is a
      head start, never a dependency. `src/lib/boot.ts` owns the same key and
      does the same thing again once React is up, for the case where this found
      nothing.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ccm.boot.v5");
          if (!raw) return;
          var stored = JSON.parse(raw);
          if (!stored || Date.now() - stored.at > 12 * 60 * 60 * 1000) return;
          var items = (stored.payload && stored.payload.topItems) || [];
          for (var i = 0; i < items.length; i++) {
            if (!items[i] || !items[i].image_url) continue;
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = items[i].image_url;
            link.fetchPriority = "high";
            document.head.appendChild(link);
            return;
          }
        } catch (e) {
          /* No storage, a payload from an older build, or private browsing. */
        }
      })();
    </script>

    <!--
      The first paint, before any JavaScript has run.

      On a slow connection the gap between the HTML landing and React mounting is
      where a white flash lives. Painting the page's own black here closes it,
      and the mark fading in gives the wait something honest to look at rather
      than a spinner, which implies an error is coming.
    -->
    <style>
      html {
        background: #070707;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #070707;
      }
      #boot img {
        width: 40px;
        height: 40px;
        animation: boot 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
      #boot p {
        max-width: 22rem;
        padding: 0 1.5rem;
        margin: 1.25rem 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #f4f4f4;
        text-align: center;
      }
      #boot[data-stuck="true"] img {
        animation: none;
        opacity: 1;
      }
      #boot .retry {
        margin-top: 1.25rem;
        padding: 0.7rem 1.4rem;
        font: inherit;
        font-family: system-ui, sans-serif;
        font-size: 0.9375rem;
        color: #f4f4f4;
        background: #e31c23;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
      }
      #boot .retry:disabled {
        opacity: 0.6;
      }
      #boot p.why {
        margin-top: 0.75rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        line-height: 1.45;
        color: #9a9a9a;
        word-break: break-word;
      }
    </style>

    <!--
      The last line of defence: getting the visitor out of a blank page.

      If the app cannot start there is nothing on screen but the mark, and no
      amount of reloading helps when the reason is a bad file being served from
      the browser's own storage, which is exactly what a stale service worker
      cache did here once. So the page watches for its own failure to start and
      clears everything it can before trying again: caches, service workers, the
      lot. That runs at most once per tab, tracked in sessionStorage, because a
      recovery that can retrigger itself is a reload loop.

      If it has already tried and the app still has not mounted, it stops and
      says so in words, with a way to reach the restaurant. A visitor who cannot
      book online should still be able to ring the door.
    -->
    <script>
      (function () {
        var RECOVERED = "ccm-recovery-attempted";
        var done = false;
        var failed = [];

        /*
         * How long to wait before a fresh attempt is allowed.
         *
         * The first version of this recorded "recovery has been tried" once and
         * never tried again, which turned out to be the worse failure: a tab
         * that spent its one attempt while the server was still broken could
         * never heal itself afterwards, no matter how many times it was reloaded
         * or how thoroughly the underlying fault had been fixed. It just showed
         * the apology forever.
         *
         * A window rather than a flag. Two failures inside twenty seconds is a
         * loop and gets stopped; a reload a minute later is a person trying
         * again, and deserves a real attempt.
         */
        var COOLDOWN = 20000;

        /* window.name survives a reload even where storage is refused, so a
           private window cannot spin. */
        function lastAttempt() {
          try {
            var v = sessionStorage.getItem(RECOVERED);
            if (v) return Number(v) || 0;
          } catch (e) {}
          var m = /ccm-recover:(\d+)/.exec(window.name || "");
          return m ? Number(m[1]) : 0;
        }

        function markAttempt(at) {
          try {
            sessionStorage.setItem(RECOVERED, String(at));
          } catch (e) {}
          try {
            window.name = "ccm-recover:" + at;
          } catch (e) {}
        }

        function clearAttempt() {
          try {
            sessionStorage.removeItem(RECOVERED);
          } catch (e) {}
          try {
            if (/ccm-recover:/.test(window.name || "")) window.name = "";
          } catch (e) {}
        }

        function mounted() {
          return !document.getElementById("boot");
        }

        function giveUp() {
          var boot = document.getElementById("boot");
          if (!boot) return;
          boot.setAttribute("data-stuck", "true");
          var note = document.createElement("p");
          note.textContent = "This page will not load. Try again in a moment, or call the restaurant to book.";
          boot.appendChild(note);

          /* Waiting out the cooldown is not something anybody should have to
             know about, so there is a button that ignores it. */
          var again = document.createElement("button");
          again.type = "button";
          again.className = "retry";
          again.textContent = "Try again";
          again.onclick = function () {
            again.disabled = true;
            again.textContent = "Trying";
            done = false;
            recover(true);
          };
          boot.appendChild(again);

          /*
           * What actually failed, in plain sight.
           *
           * Guessing at this from the outside is how a fault like this survives
           * more than one attempt to fix it. The page can see the answer, so it
           * says it rather than leaving somebody to describe a blank screen.
           */
          var url = failed[0];
          if (!url || !window.fetch) return;
          var why = document.createElement("p");
          why.className = "why";
          why.textContent = "Checking what failed";
          boot.appendChild(why);

          fetch(url, { cache: "reload" })
            .then(function (r) {
              return r.text().then(function (body) {
                var isPage = body.slice(0, 60).toLowerCase().indexOf("<!doctype") !== -1;
                why.textContent =
                  url.split("/").pop() +
                  " HTTP " +
                  r.status +
                  ", " +
                  (r.headers.get("content-type") || "no type") +
                  (isPage ? " (a web page where code should be)" : "");
              });
            })
            .catch(function (e) {
              why.textContent = url.split("/").pop() + " " + String((e && e.message) || e).slice(0, 70);
            });
        }

        /* Wipes every cache and service worker this origin owns, then reloads.
           Belt and braces: either one alone can be what is holding the bad file,
           and by this point we care about getting in, not about tidiness. */
        function recover(force) {
          if (done || mounted()) return;
          done = true;

          // Two failures in quick succession is a loop, not a person retrying.
          if (!force && Date.now() - lastAttempt() < COOLDOWN) {
            giveUp();
            return;
          }
          markAttempt(Date.now());

          var jobs = [];
          if (window.caches && caches.keys) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (n) {
                    return caches.delete(n);
                  })
                );
              })
            );
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  })
                );
              })
            );
          }

          /*
           * The browser's own HTTP cache, which is a separate store from
           * everything above and the reason a first attempt at this fix did not
           * work.
           *
           * Assets are served `immutable` for a year, which is right for a file
           * whose name contains its hash, until the wrong body is stored under
           * that name. `immutable` means the browser will not so much as ask
           * whether it is still valid, so clearing the service worker changed
           * nothing: the same bad response came straight back off the disk.
           *
           * `cache: "reload"` is the one way out. It ignores what is stored,
           * goes to the network, and writes what it gets back over the entry, so
           * the reload below starts from the real file.
           *
           * Every asset the document names, whatever tag names it. The build
           * pulls the big chunks in with <link rel="modulepreload">, not
           * <script src>, so a selector that only looked for scripts and
           * stylesheets left the largest one poisoned and the page still broken,
           * with the network serving a perfectly good copy.
           */
          jobs.push(
            Promise.all(
              [].map
                .call(document.querySelectorAll("script[src], link[href]"), function (el) {
                  return el.src || el.href;
                })
                .filter(function (u) {
                  return u && u.indexOf("/assets/") !== -1;
                })
                .map(function (u) {
                  return fetch(u, { cache: "reload", credentials: "same-origin" }).catch(function () {});
                })
            )
          );

          Promise.all(jobs)
            .catch(function () {})
            .then(function () {
              location.replace(location.pathname + location.search + location.hash);
            });
        }

        /* A script or stylesheet that failed outright: the wrong MIME type, a
           404, a dead hash from an older deploy. This is the real signal, and it
           arrives immediately rather than after a timeout.

           Only the app's own code counts. A manifest or an icon that fails to
           load is not a reason to wipe storage and reload the page. */
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) return;
            var tag = el.tagName.toLowerCase();
            if (tag !== "script" && tag !== "link") return;
            var url = el.src || el.href || "";
            if (url.indexOf("/assets/") === -1) return;
            if (failed.indexOf(url) === -1) failed.push(url);
            recover();
          },
          true
        );

        /* Backstop, for a failure that is silent rather than noisy.
           Deliberately generous: a slow phone on a bad connection is not a
           broken page, and must be given time to finish rather than be reloaded
           out from under itself. */
        window.setTimeout(function () {
          if (!mounted()) recover();
        }, 25000);

        /* Once the app is up none of this should ever fire again, and the flag
           must not survive into the next visit and turn a single real failure
           into an immediate give-up. */
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            if (mounted()) {
              done = true;
              clearAttempt();
            }
          }, 0);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="/mark.svg" alt="Cam Chop Meat" width="40" height="40" />
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #f4f4f4; background: #070707">
        This site needs JavaScript. Turn it on and reload, or call the restaurant to book.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
